# Runs behind a Traefik already installed on the server (v3, Docker provider), through its
# external network. Variables come from apps/web/.env (`pnpm docker:prod`), see .env.example.
x-traefik: &traefik
  traefik.enable: 'true'
  traefik.docker.network: '${TRAEFIK_NETWORK:-traefik}'

services:
  web:
    container_name: '${COMPOSE_PROJECT_NAME}_web'
    # Pushed by scripts/deploy.sh; built on the spot when absent.
    image: '${REGISTRY:-onvep-mcr}/web:${TAG:-latest}'
    restart: always
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - apps/web/.env
    networks:
      - sail
      - traefik
    depends_on:
      pgsql:
        condition: service_healthy
    environment:
      # All interfaces: the container sits on two networks.
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: production
      DB_HOST: pgsql
      APP_URL: 'https://${APP_DOMAIN?:err}'
      CONTEXT_ENGINE_URL: http://context-engine:3334
      CONTEXT_ENGINE_PUBLIC_URL: 'https://${CONTEXT_ENGINE_DOMAIN?:err}'
      NODE_RED_URL: 'https://${NODE_RED_DOMAIN?:err}'
    volumes:
      # Uploaded files (drive "fs" disk).
      - web-uploads:/app/apps/web/build/tmp
    labels:
      <<: *traefik
      traefik.http.routers.onvep-mcr-web.rule: 'Host(`${APP_DOMAIN}`)'
      traefik.http.routers.onvep-mcr-web.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.onvep-mcr-web.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      traefik.http.services.onvep-mcr-web.loadbalancer.server.port: '3333'

  context-engine:
    container_name: '${COMPOSE_PROJECT_NAME}_context-engine'
    image: '${REGISTRY:-onvep-mcr}/context-engine:${TAG:-latest}'
    restart: always
    build:
      context: .
      dockerfile: apps/context-engine/Dockerfile
    env_file:
      - apps/context-engine/.env
    networks:
      - sail
      - traefik
    depends_on:
      pgsql:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3334
      NODE_ENV: production
      DB_HOST: pgsql
      APP_URL: 'https://${CONTEXT_ENGINE_DOMAIN}'
    volumes:
      # MUTATORS_PATH (storage/mutators) relative to the built app.
      - context-engine-mutators:/app/apps/context-engine/build/storage/mutators
    labels:
      <<: *traefik
      # The engine has no authentication. Public: what CG pages need in the browser, i.e.
      # reading the context and its SSE stream. Writes go through the Docker network (web,
      # Node-RED), or from the IPs of CONTEXT_ENGINE_WRITE_ALLOWED_IPS (Companion…).
      traefik.http.routers.onvep-mcr-engine-read.rule: >-
        Host(`${CONTEXT_ENGINE_DOMAIN}`) && (PathPrefix(`/__transmit`)
        || (PathPrefix(`/context`) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))))
      traefik.http.routers.onvep-mcr-engine-read.priority: '20'
      traefik.http.routers.onvep-mcr-engine-read.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.onvep-mcr-engine-read.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      traefik.http.routers.onvep-mcr-engine-read.service: onvep-mcr-engine
      traefik.http.routers.onvep-mcr-engine.rule: 'Host(`${CONTEXT_ENGINE_DOMAIN}`)'
      traefik.http.routers.onvep-mcr-engine.priority: '10'
      traefik.http.routers.onvep-mcr-engine.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.onvep-mcr-engine.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      traefik.http.routers.onvep-mcr-engine.service: onvep-mcr-engine
      traefik.http.routers.onvep-mcr-engine.middlewares: onvep-mcr-engine-writers
      traefik.http.middlewares.onvep-mcr-engine-writers.ipallowlist.sourcerange: '${CONTEXT_ENGINE_WRITE_ALLOWED_IPS:-127.0.0.1/32}'
      traefik.http.services.onvep-mcr-engine.loadbalancer.server.port: '3334'

  node-red:
    restart: always
    ports: !reset []
    extra_hosts: !reset []
    networks:
      - sail
      - traefik
    depends_on:
      - context-engine
    environment:
      CONTEXT_ENGINE_URL: http://context-engine:3334
    labels:
      <<: *traefik
      # Node-RED has no authentication of its own here: basic auth at the proxy.
      traefik.http.routers.onvep-mcr-node-red.rule: 'Host(`${NODE_RED_DOMAIN}`)'
      traefik.http.routers.onvep-mcr-node-red.entrypoints: '${TRAEFIK_ENTRYPOINT:-websecure}'
      traefik.http.routers.onvep-mcr-node-red.tls.certresolver: '${TRAEFIK_CERTRESOLVER:-letsencrypt}'
      traefik.http.routers.onvep-mcr-node-red.middlewares: onvep-mcr-node-red-auth
      traefik.http.middlewares.onvep-mcr-node-red-auth.basicauth.users: '${NODE_RED_BASIC_AUTH?:err}'
      traefik.http.services.onvep-mcr-node-red.loadbalancer.server.port: '1880'

  pgsql:
    ports: !reset []
    restart: always

  # Development tools: not started in production.
  pgadmin:
    profiles: [dev]
  mailpit:
    profiles: [dev]

networks:
  traefik:
    name: '${TRAEFIK_NETWORK:-traefik}'
    external: true

volumes:
  web-uploads:
  context-engine-mutators:
