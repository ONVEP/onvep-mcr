services:
  pgsql:
    container_name: '${COMPOSE_PROJECT_NAME}_pgsql'
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: '${DB_DATABASE:-default}'
      POSTGRES_USER: '${DB_USER?:err}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - pgsql:/var/lib/postgresql
      - ./../../.github/postgres/dev-init.sql:/docker-entrypoint-initdb.d/init.sql # will setup dev database adonis_app for us
    ports:
      - '5432:5432'
    restart: unless-stopped
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-default}', '-U', '${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    container_name: '${COMPOSE_PROJECT_NAME}_pgadmin'
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: '${PGADMIN_MAIL:-admin@repo.com}'
      PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_PW:-secret}'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
    ports:
      - '5050:80'
    restart: unless-stopped
    volumes:
      - pgadmin:/root/.pgadmin
      - ./../../.github/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - sail

  mailpit:
    container_name: '${COMPOSE_PROJECT_NAME}_mailpit'
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    volumes:
      - ./tmp/mailpit:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  node-red:
    container_name: '${COMPOSE_PROJECT_NAME}_node-red'
    image: nodered/node-red:5.0.9
    restart: unless-stopped
    ports:
      - '${NODE_RED_PORT:-1880}:1880'
    # The context engine runs on the host (`pnpm dev`) and must listen beyond the loopback
    # (HOST=0.0.0.0 in apps/context-engine/.env). With rootless Docker, host.docker.internal
    # doesn't reach the host: set NODE_RED_CONTEXT_ENGINE_URL to the host's LAN IP instead.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      CONTEXT_ENGINE_URL: '${NODE_RED_CONTEXT_ENGINE_URL:-http://host.docker.internal:3334}'
    volumes:
      - node-red:/data
      # Loaded as local nodes: edits only need a container restart.
      - ./../../packages/node-red-contrib-context-engine:/data/nodes/context-engine:ro
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  pgsql:
  pgadmin:
  node-red:
